[supervisord]
nodaemon=false
logfile=/root/.openclaw/workspace/fomo_workflow/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/fomo_supervisord.pid
loglevel=info

[supervisorctl]
serverurl=unix:///tmp/fomo_supervisor.sock

[unix_http_server]
file=/tmp/fomo_supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:fomo_workflow]
command=python3 /root/.openclaw/workspace/fomo_workflow/main.py
directory=/root/.openclaw/workspace/fomo_workflow
autostart=true
autorestart=true
startsecs=5
startretries=999
stopwaitsecs=30
stdout_logfile=/root/.openclaw/workspace/fomo_workflow/trade.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/root/.openclaw/workspace/fomo_workflow/trade_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
