# fx 固定回归范围（P-13）。运行：cd fx && python3 -m pytest
# - testpaths：原手动"扩大回归组"17 个文件
# - network 标记：需联网的测试加 @pytest.mark.network，默认排除；需要时 -m network
# - test_phase5_dispatch.py：文件内 pytestmark 已默认 skip，FX_RUN_PHASE5=1 才运行
# - test_shutdown.py / test_task_exception.py：收集阶段 StopIteration，排除（待修，见 OPTIMIZATION_PENDING.md P-13）
[pytest]
testpaths =
    tests/test_judges_optimized.py
    tests/test_analyze_one.py
    tests/test_judge.py
    tests/test_judges_extra.py
    tests/test_judge_routes_contract.py
    tests/test_llm_judge_contract.py
    tests/test_hub_load_pool.py
    tests/test_analysis_pool.py
    tests/test_trigger_detector.py
    tests/test_phase5_dispatch.py
    tests/test_hot_config.py
    tests/test_funnel_stats.py
    tests/test_signal_watcher_v2.py
    tests/test_trigger_identity.py
    tests/test_cancel_paths.py
    tests/test_cancel_state_batch1.py
    tests/test_notifier_flush_timing.py
    tests/test_order_event_loop_executor.py
    tests/test_close_post_exclusive.py
markers =
    network: marks tests that require network
addopts = -m "not network" --ignore=tests/test_shutdown.py --ignore=tests/test_task_exception.py -p no:cacheprovider
